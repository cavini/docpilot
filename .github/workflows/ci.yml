name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI connects to these. They exist because configuration is
  # validated at startup, and the OpenAPI export has to build the application
  # graph in order to read its routes.
  DATABASE_URL: postgres://docpilot:docpilot@localhost:5432/docpilot
  REDIS_URL: redis://localhost:6379
  # Deterministic, free, and no key required. CI never needs a secret.
  LLM_PROVIDER: mock
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  static:
    name: Format, lint, types and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Regenerating the spec and diffing turns an undocumented endpoint or a
      # changed response shape into a build failure, rather than something a
      # generated client discovers later.
      - name: OpenAPI spec is up to date
        run: |
          pnpm openapi:export
          git diff --exit-code -- apps/api/openapi.json \
            || { echo '::error::openapi.json is stale. Run `pnpm openapi:export` and commit the result.'; exit 1; }

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/**'
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Integration, API end-to-end and contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Testcontainers starts Postgres, Redis and S3 itself rather than this
      # job declaring service containers, so the same command runs here and on
      # a developer's machine. See docs/testing.md.
      - run: pnpm test:integration
      - run: pnpm test:api-e2e
      - run: pnpm test:contract

  component:
    name: Component tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @docpilot/ui exec playwright install --with-deps chromium

      # Every story's play function, plus an accessibility check on each story.
      - run: pnpm test:storybook

      - name: Cypress component tests
        run: pnpm test:component

      - name: Storybook builds
        run: pnpm --filter @docpilot/ui build:storybook

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @docpilot/web exec playwright install --with-deps chromium

      # The API is stubbed at the network layer, so this needs no database and
      # no key. Journeys that need the backend will start it with the mock
      # model.
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm build
