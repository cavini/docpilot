name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every suite runs against the mock provider, so CI needs no API key and
  # cannot spend anything. That is a property worth keeping: a test suite that
  # needs a secret is a test suite contributors cannot run.
  LLM_PROVIDER: mock

jobs:
  # Fast feedback. Nothing here needs Docker, so it answers in a minute while
  # the heavier job is still pulling images.
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Generated from the code, so a drifted file means someone changed a
      # contract without regenerating it.
      - name: OpenAPI is up to date
        run: |
          pnpm openapi:export
          git diff --exit-code apps/api/openapi.json \
            || { echo "::error::openapi.json is stale. Run pnpm openapi:export and commit it."; exit 1; }

  # Everything that needs real Postgres, Redis and S3. Testcontainers starts
  # them, so there is nothing to configure here.
  integration:
    name: Integration, API e2e, contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration

      - name: API end-to-end tests
        run: pnpm test:api-e2e

      - name: Contract tests
        run: pnpm test:contract

  browser:
    name: Component, Storybook, browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests
        run: pnpm test:component

      - name: Storybook tests
        run: pnpm test:storybook

      - name: Browser end-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Builds the image CI would deploy. Catches a Dockerfile that drifts from
  # the workspace, which no test suite would notice.
  image:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
