packages:
  - 'apps/*'
  - 'packages/*'
  - 'evals'

# pnpm 10 does not run dependency build scripts unless they are listed here.
# Keep this list short and add an entry only when a package genuinely needs to
# compile a native or platform-specific binary at install time.
onlyBuiltDependencies:
  # Native file watcher used by `nest start --watch`; without it the CLI falls
  # back to polling.
  - '@parcel/watcher'
  - '@swc/core'
  # Downloads a platform-specific browser runner on install. Skipping it
  # leaves a machine that has never run Cypress with no binary at all, which
  # only shows up on a fresh checkout - a developer who has run it once keeps
  # a cached copy and never sees the failure.
  - cypress
  - esbuild
  - sharp
  - unrs-resolver

# tslib 2.9.1 is tagged `latest` on npm but its tarball returns 404, which
# breaks any install that resolves the `^2.6.2` range the AWS SDK asks for.
# Pinned to the last publish that actually downloads. Remove once upstream
# republishes.
overrides:
  tslib: 2.8.1
